<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Journal - Space Timeline</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    overflow: hidden;
    background: #000;
    font-family: 'Inter', sans-serif;
    color: #e0e0e0;
    user-select: none;
  }

  #canvas3d {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    cursor: grab;
  }

  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 20px 30px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
  }

  .settings-btn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  .settings-btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.3);
    transform: rotate(45deg);
  }

  .settings-btn svg {
    width: 22px; height: 22px;
    stroke: #ccc; fill: none; stroke-width: 1.8;
  }

  .date-display {
    position: fixed;
    top: 24px; left: 30px;
    z-index: 100;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 2px;
  }

  .date-display .year {
    font-size: 32px;
    color: rgba(255,255,255,0.85);
    font-weight: 700;
    letter-spacing: 4px;
    display: block;
    margin-top: 4px;
  }

  .settings-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .settings-overlay.active { opacity: 1; pointer-events: all; }

  .settings-panel {
    position: fixed; top: 20px; right: 20px;
    width: 340px;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    z-index: 201;
    background: rgba(15, 15, 25, 0.92);
    backdrop-filter: blur(40px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 28px;
    transform: translateX(400px);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .settings-panel.active { transform: translateX(0); }

  .settings-panel::-webkit-scrollbar { width: 4px; }
  .settings-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

  .settings-title {
    font-size: 18px; font-weight: 600; margin-bottom: 24px; color: #fff;
    display: flex; align-items: center; gap: 10px;
  }
  .settings-title svg { width: 20px; height: 20px; stroke: #aaa; fill: none; stroke-width: 1.8; }

  .setting-group { margin-bottom: 22px; }
  .setting-group label {
    display: block; font-size: 11px; text-transform: uppercase;
    letter-spacing: 1.5px; color: rgba(255,255,255,0.45); margin-bottom: 8px; font-weight: 500;
  }

  .dob-input {
    width: 100%; padding: 12px 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; color: #fff;
    font-family: 'Space Mono', monospace; font-size: 14px;
    outline: none; transition: border-color 0.3s;
  }
  .dob-input:focus { border-color: rgba(100,140,255,0.5); }
  .dob-input::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

  .size-control { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .size-control input[type="range"] {
    flex: 1; -webkit-appearance: none; height: 4px;
    background: rgba(255,255,255,0.12); border-radius: 2px; outline: none;
  }
  .size-control input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; cursor: pointer; box-shadow: 0 0 10px rgba(255,255,255,0.3);
  }
  .size-control span {
    font-size: 12px; color: rgba(255,255,255,0.4); min-width: 50px;
  }
  .size-value {
    font-family: 'Space Mono', monospace; font-size: 12px;
    color: rgba(255,255,255,0.5); min-width: 36px; text-align: right;
  }

  .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
  .toggle-label { font-size: 13px; color: rgba(255,255,255,0.7); }

  .toggle-switch {
    width: 44px; height: 24px; background: rgba(255,255,255,0.1);
    border-radius: 12px; cursor: pointer; position: relative;
    transition: background 0.3s; border: none; outline: none;
  }
  .toggle-switch.active { background: rgba(80,120,255,0.6); }
  .toggle-switch::after {
    content: ''; position: absolute; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; top: 3px; left: 3px;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .toggle-switch.active::after { transform: translateX(20px); }

  .divider { height: 1px; background: rgba(255,255,255,0.08); margin: 18px 0; }

  .journal-overlay {
    position: fixed; bottom: 0; left: 0; right: 0;
    z-index: 150; display: flex; justify-content: center;
    pointer-events: none;
  }

  .journal-panel {
    width: 600px; max-width: 90vw;
    background: rgba(12, 12, 22, 0.95);
    backdrop-filter: blur(40px);
    border: 1px solid rgba(255,255,255,0.08);
    border-bottom: none;
    border-radius: 24px 24px 0 0;
    transform: translateY(100%);
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: all;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .journal-panel.active { transform: translateY(0); }

  .journal-header {
    padding: 24px 28px 16px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .journal-date { font-family: 'Space Mono', monospace; font-size: 14px; color: rgba(255,255,255,0.6); }
  .journal-year-badge {
    font-family: 'Space Mono', monospace; font-size: 11px;
    padding: 4px 12px; background: rgba(100,140,255,0.15);
    border: 1px solid rgba(100,140,255,0.25); border-radius: 20px;
    color: rgba(140,170,255,0.9);
  }

  .journal-input-area { flex: 1; padding: 20px 28px 28px; overflow-y: auto; }
  .journal-input-area::-webkit-scrollbar { width: 4px; }
  .journal-input-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

  .journal-textarea {
    width: 100%; min-height: 200px;
    background: transparent; border: none; outline: none;
    color: rgba(255,255,255,0.85);
    font-family: 'Inter', sans-serif; font-size: 15px;
    line-height: 1.8; resize: vertical; font-weight: 300;
  }
  .journal-textarea::placeholder { color: rgba(255,255,255,0.2); }

  .journal-saved-entries { margin-top: 16px; }
  .journal-saved-entries .entry-item {
    padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .journal-saved-entries .entry-item .e-date {
    color: rgba(255,255,255,0.35); font-family: 'Space Mono', monospace;
    font-size: 11px; display: block; margin-bottom: 4px;
  }
  .journal-saved-entries .entry-item .e-text {
    color: rgba(255,255,255,0.55); font-size: 13px; line-height: 1.5;
  }

  .journal-footer {
    padding: 12px 28px 20px;
    display: flex; justify-content: flex-end; gap: 10px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .journal-btn {
    padding: 10px 24px; border-radius: 12px; border: none;
    cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
    transition: all 0.2s;
  }
  .journal-btn.cancel { background: transparent; color: rgba(255,255,255,0.4); }
  .journal-btn.cancel:hover { color: rgba(255,255,255,0.7); }
  .journal-btn.save {
    background: linear-gradient(135deg, #4060d0, #6080f0);
    color: #fff; box-shadow: 0 4px 20px rgba(60,100,220,0.3);
  }
  .journal-btn.save:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(60,100,220,0.4); }

  .earth-tooltip {
    position: fixed; z-index: 90; pointer-events: none;
    background: rgba(10,10,20,0.85); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
    padding: 8px 14px; font-size: 12px; color: rgba(255,255,255,0.7);
    opacity: 0; transition: opacity 0.2s; white-space: nowrap;
  }
  .earth-tooltip.visible { opacity: 1; }

  .loading-screen {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #000; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.8s ease;
  }
  .loading-screen.hidden { opacity: 0; pointer-events: none; }

  .loading-ring {
    width: 60px; height: 60px;
    border: 2px solid rgba(255,255,255,0.1);
    border-top-color: rgba(255,255,255,0.6);
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  .loading-text {
    margin-top: 20px; font-family: 'Space Mono', monospace;
    font-size: 12px; color: rgba(255,255,255,0.4); letter-spacing: 3px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .info-badge {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 100; font-size: 11px; color: rgba(255,255,255,0.25);
    letter-spacing: 1px; font-family: 'Space Mono', monospace;
  }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-ring"></div>
  <div class="loading-text">INITIALIZING COSMOS</div>
</div>

<canvas id="canvas3d"></canvas>

<div class="top-bar">
  <button class="settings-btn" id="settingsBtn" title="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4"/></svg>
  </button>
</div>

<div class="date-display">
  <span id="currentDate">Today</span>
  <span class="year" id="currentYear">2025</span>
</div>

<div class="settings-overlay" id="settingsOverlay"></div>
<div class="settings-panel" id="settingsPanel">
  <div class="settings-title">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4"/></svg>
    Settings
  </div>

  <div class="setting-group">
    <label>Date of Birth</label>
    <input type="date" class="dob-input" id="dobInput">
  </div>

  <div class="divider"></div>

  <div class="setting-group">
    <label>Bodies Size</label>
    <div class="size-control"><span>☉ Sun</span><input type="range" id="sunSize" min="0.5" max="5" step="0.1" value="2.5"><span class="size-value" id="sunSizeVal">2.5</span></div>
    <div class="size-control"><span>⊕ Earth</span><input type="range" id="earthSize" min="0.3" max="3" step="0.1" value="1"><span class="size-value" id="earthSizeVal">1.0</span></div>
    <div class="size-control"><span>☽ Moon</span><input type="range" id="moonSize" min="0.1" max="1.5" step="0.1" value="0.35"><span class="size-value" id="moonSizeVal">0.35</span></div>
  </div>

  <div class="divider"></div>

  <div class="toggle-row"><span class="toggle-label">Star Field</span><button class="toggle-switch active" id="toggleStars"></button></div>
  <div class="toggle-row"><span class="toggle-label">Orbit Trail</span><button class="toggle-switch active" id="toggleOrbit"></button></div>
  <div class="toggle-row"><span class="toggle-label">Sun Glow</span><button class="toggle-switch active" id="toggleGlow"></button></div>
  <div class="toggle-row"><span class="toggle-label">Auto Rotate</span><button class="toggle-switch active" id="toggleAutoRotate"></button></div>
</div>

<div class="earth-tooltip" id="earthTooltip">Click Earth to journal</div>

<div class="journal-overlay" id="journalOverlay">
  <div class="journal-panel" id="journalPanel">
    <div class="journal-header">
      <span class="journal-date" id="journalDate">January 1, 2025</span>
      <span class="journal-year-badge" id="journalYearBadge">Year 0</span>
    </div>
    <div class="journal-input-area">
      <textarea class="journal-textarea" id="journalTextarea" placeholder="What happened on this day in your cosmic journey?"></textarea>
      <div class="journal-saved-entries" id="journalEntries"></div>
    </div>
    <div class="journal-footer">
      <button class="journal-btn cancel" id="journalCancel">Close</button>
      <button class="journal-btn save" id="journalSave">Save Entry</button>
    </div>
  </div>
</div>

<div class="info-badge">✦ Drag to orbit · Scroll to zoom · Click Earth to journal</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  // ===== STATE =====
  let dateOfBirth = new Date('1990-06-15');
  const AGE_LIMIT = 100;
  let showStars = true, showOrbit = true, showGlow = true, autoRotate = false;
  let sunScale = 2.5, earthScale = 1.0, moonScale = 0.35;
  let journalEntries = {};

  // ===== THREE.JS =====
  const canvas = document.getElementById('canvas3d');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000005);
  scene.fog = new THREE.FogExp2(0x000005, 0.008);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 30, 60);
  camera.lookAt(0, 0, 0);

  // ===== LIGHTING =====
  scene.add(new THREE.AmbientLight(0x222233, 0.3));
  const sunLight = new THREE.PointLight(0xffeedd, 2.5, 200);
  sunLight.position.set(0, 0, 0);
  scene.add(sunLight);
  const sunLight2 = new THREE.PointLight(0xffaa44, 1.5, 100);
  sunLight2.position.set(0, 5, 0);
  scene.add(sunLight2);

  // ===== SUN =====
  const sunGeo = new THREE.SphereGeometry(1, 64, 64);
  const sunMat = new THREE.MeshBasicMaterial({ color: 0xffcc44 });
  const sunMesh = new THREE.Mesh(sunGeo, sunMat);
  sunMesh.scale.setScalar(sunScale);
  scene.add(sunMesh);

  // Glow layers
  function createGlowLayer(radius, color, opacity) {
    const g = new THREE.SphereGeometry(radius, 32, 32);
    const m = new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.BackSide });
    const mesh = new THREE.Mesh(g, m);
    mesh.scale.setScalar(sunScale);
    return mesh;
  }
  const glowMesh = createGlowLayer(1.8, 0xff8800, 0.15);
  const glow2Mesh = createGlowLayer(3, 0xff6600, 0.05);
  scene.add(glowMesh, glow2Mesh);

  // ===== EARTH =====
  const earthGroup = new THREE.Group();
  earthGroup.name = 'earthGroup';

  const earthGeo = new THREE.SphereGeometry(0.5, 48, 48);
  const earthMat = new THREE.MeshPhongMaterial({
    color: 0x2255aa, emissive: 0x112244, emissiveIntensity: 0.15,
    shininess: 30, specular: 0x334455
  });
  const earthMesh = new THREE.Mesh(earthGeo, earthMat);
  earthMesh.scale.setScalar(earthScale);
  earthMesh.name = 'earth';
  earthGroup.add(earthMesh);

  // Atmosphere
  const atmosGeo = new THREE.SphereGeometry(0.58, 32, 32);
  const atmosMat = new THREE.MeshBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.1, side: THREE.BackSide });
  earthGroup.add(new THREE.Mesh(atmosGeo, atmosMat).scale.setScalar(earthScale));

  // Texture
  const c2d = document.createElement('canvas');
  c2d.width = 256; c2d.height = 128;
  const cx = c2d.getContext('2d');
  cx.fillStyle = '#1a4466';
  cx.fillRect(0, 0, 256, 128);
  cx.fillStyle = '#227744';
  [[60,30,40,25],[100,35,30,20],[140,40,25,30],[180,50,35,20],[220,35,20,25],[80,65,20,15],[150,70,30,15]].forEach(c => {
    cx.beginPath();
    cx.ellipse(c[0], c[1], c[2]/2, c[3]/2, Math.random()*0.5, 0, Math.PI*2);
    cx.fill();
  });
  const tex = new THREE.CanvasTexture(c2d);
  const earthTexMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.505, 48, 48),
    new THREE.MeshPhongMaterial({ map: tex, shininess: 20 })
  );
  earthTexMesh.scale.setScalar(earthScale);
  earthGroup.add(earthTexMesh);

  scene.add(earthGroup);

  // ===== MOON =====
  const moonGeo = new THREE.SphereGeometry(0.15, 24, 24);
  const moonMat = new THREE.MeshPhongMaterial({ color: 0xbbbbbb, shininess: 5 });
  const moonMesh = new THREE.Mesh(moonGeo, moonMat);
  moonMesh.scale.setScalar(moonScale);
  earthGroup.add(moonMesh);

  // Moon orbit ring
  const moonOrbitGeo = new THREE.RingGeometry(0.8*earthScale, 0.82*earthScale, 48);
  const moonOrbitMat = new THREE.MeshBasicMaterial({ color: 0x666688, transparent: true, opacity: 0.2, side: THREE.DoubleSide });
  const moonOrbitMesh = new THREE.Mesh(moonOrbitGeo, moonOrbitMat);
  moonOrbitMesh.rotation.x = Math.PI/2;
  earthGroup.add(moonOrbitMesh);

  // ===== SPIRAL (constant radius) =====
  const coils = AGE_LIMIT;
  const pointsPerCoil = 120;
  const totalPoints = coils * pointsPerCoil;
  const RADIUS_X = 30;
  const RADIUS_Z = 10;
  const SPIRAL_HEIGHT = 40; // total Y span
  const spiralPoints = [];

  function generateSpiral() {
    spiralPoints.length = 0;
    for (let i = 0; i <= totalPoints; i++) {
      const t = i / totalPoints;
      const angle = t * coils * Math.PI * 2;
      const x = Math.cos(angle) * RADIUS_X;
      const z = Math.sin(angle) * RADIUS_Z;
      const y = (t - 0.5) * SPIRAL_HEIGHT;
      spiralPoints.push(new THREE.Vector3(x, y, z));
    }
  }
  generateSpiral();

  const orbitLineGeo = new THREE.BufferGeometry().setFromPoints(spiralPoints);
  const orbitLineMat = new THREE.LineBasicMaterial({ color: 0x4466aa, transparent: true, opacity: 0.25 });
  const orbitLine = new THREE.Line(orbitLineGeo, orbitLineMat);
  scene.add(orbitLine);

  // ===== STARS =====
  let starField, milkyWay;
  function createStars() {
    if (starField) scene.remove(starField);
    if (milkyWay) scene.remove(milkyWay);

    const count = 8000;
    const pos = new Float32Array(count*3);
    const col = new Float32Array(count*3);

    for (let i = 0; i < count; i++) {
      const r = 100 + Math.random() * 400;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2*Math.random() - 1);
      pos[i*3] = r*Math.sin(ph)*Math.cos(th);
      pos[i*3+1] = r*Math.sin(ph)*Math.sin(th);
      pos[i*3+2] = r*Math.cos(ph);

      const mwF = Math.exp(-Math.abs(pos[i*3+1])/40)*0.7 + 0.3;
      const temp = Math.random();
      if (temp < 0.3) { col[i*3]=0.7; col[i*3+1]=0.7; col[i*3+2]=0.9; }
      else if (temp < 0.6) { col[i*3]=1; col[i*3+1]=0.95; col[i*3+2]=0.7; }
      else { col[i*3]=0.85; col[i*3+1]=0.85; col[i*3+2]=0.85; }
      col[i*3]*=mwF; col[i*3+1]*=mwF; col[i*3+2]*=mwF;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const mat = new THREE.PointsMaterial({ size:0.6, vertexColors:true, transparent:true, opacity:0.85, sizeAttenuation:true, blending:THREE.AdditiveBlending, depthWrite:false });
    starField = new THREE.Points(geo, mat);
    scene.add(starField);

    // Milky Way band
    const mwCount = 3000;
    const mwPos = new Float32Array(mwCount*3);
    const mwCol = new Float32Array(mwCount*3);
    for (let i = 0; i < mwCount; i++) {
      const x = (Math.random()-0.5)*500;
      const y = (Math.random()-0.5)*30;
      const z = (Math.random()-0.5)*500;
      mwPos[i*3]=x; mwPos[i*3+1]=y; mwPos[i*3+2]=z;
      const b = 0.3+Math.random()*0.4;
      mwCol[i*3]=b*0.8; mwCol[i*3+1]=b*0.7; mwCol[i*3+2]=b*1.0;
    }
    const mwGeo = new THREE.BufferGeometry();
    mwGeo.setAttribute('position', new THREE.BufferAttribute(mwPos, 3));
    mwGeo.setAttribute('color', new THREE.BufferAttribute(mwCol, 3));
    const mwMat = new THREE.PointsMaterial({ size:0.4, vertexColors:true, transparent:true, opacity:0.4, sizeAttenuation:true, blending:THREE.AdditiveBlending, depthWrite:false });
    milkyWay = new THREE.Points(mwGeo, mwMat);
    scene.add(milkyWay);
  }
  createStars();

  // ===== GHOST EARTHS (for journal entries) =====
  const ghostEarthMeshes = [];

  function getGhostEarthPosition(yearProgress) {
    const t = Math.min(Math.max(yearProgress / AGE_LIMIT, 0), 1);
    const angle = t * coils * Math.PI * 2;
    return new THREE.Vector3(
      Math.cos(angle) * RADIUS_X,
      (t - 0.5) * SPIRAL_HEIGHT,
      Math.sin(angle) * RADIUS_Z
    );
  }

  function updateGhostEarths() {
    ghostEarthMeshes.forEach(g => scene.remove(g));
    ghostEarthMeshes.length = 0;

    Object.keys(journalEntries).forEach(key => {
      const savedDate = new Date(key);
      const diffMs = savedDate.getTime() - dateOfBirth.getTime();
      const diffYears = diffMs / (1000*60*60*24*365.25);
      if (diffYears >= 0 && diffYears < AGE_LIMIT) {
        const pos = getGhostEarthPosition(diffYears);
        const geo = new THREE.SphereGeometry(0.5, 16, 16);
        const mat = new THREE.MeshPhongMaterial({
          color: 0x4488ff,
          transparent: true,
          opacity: 0.1,
          depthWrite: false
        });
        const ghost = new THREE.Mesh(geo, mat);
        ghost.scale.setScalar(earthScale);
        ghost.position.copy(pos);
        scene.add(ghost);
        ghostEarthMeshes.push(ghost);
      }
    });
  }

  // ===== EARTH POSITION FOR CURRENT DATE =====
  function getCurrentEarthPos() {
    const now = new Date();
    const diffMs = now.getTime() - dateOfBirth.getTime();
    const diffYears = diffMs / (1000*60*60*24*365.25);
    return getGhostEarthPosition(diffYears);
  }

  function updateEarthPosition(date) {
    const diffMs = date.getTime() - dateOfBirth.getTime();
    const diffYears = diffMs / (1000*60*60*24*365.25);
    const pos = getGhostEarthPosition(diffYears);
    earthGroup.position.copy(pos);
  }

  const now = new Date();
  updateEarthPosition(now);
  updateGhostEarths();

  // ===== CAMERA ORBIT (static solar system, camera moves) =====
  let targetRotY = 0, targetRotX = 0;
  let currentRotY = 0, currentRotX = 0;
  let camDist = 60, targetCamDist = 60;
  let isDragging = false, prevMX = 0, prevMY = 0;

  canvas.addEventListener('mousedown', (e) => { isDragging = true; prevMX = e.clientX; prevMY = e.clientY; });
  document.addEventListener('mouseup', () => { isDragging = false; });
  document.addEventListener('mouseleave', () => { isDragging = false; });

  canvas.addEventListener('mousemove', (e) => {
    if (isDragging) {
      const dx = e.clientX - prevMX;
      const dy = e.clientY - prevMY;
      targetRotY += dx * 0.005;
      targetRotX += dy * 0.005;
      targetRotX = Math.max(-1.2, Math.min(1.2, targetRotX));
      prevMX = e.clientX;
      prevMY = e.clientY;
    }
  });

  canvas.addEventListener('wheel', (e) => {
    targetCamDist += e.deltaY * 0.03;
    targetCamDist = Math.max(20, Math.min(150, targetCamDist));
  });

  // Touch
  canvas.addEventListener('touchstart', (e) => { if(e.touches.length===1){ isDragging=true; prevMX=e.touches[0].clientX; prevMY=e.touches[0].clientY; }});
  canvas.addEventListener('touchmove', (e) => {
    if(isDragging && e.touches.length===1){
      const dx=e.touches[0].clientX-prevMX, dy=e.touches[0].clientY-prevMY;
      targetRotY+=dx*0.005; targetRotX+=dy*0.005;
      targetRotX=Math.max(-1.2,Math.min(1.2,targetRotX));
      prevMX=e.touches[0].clientX; prevMY=e.touches[0].clientY;
    }
  });
  canvas.addEventListener('touchend', () => { isDragging=false; });

  // ===== RAYCASTING =====
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  const tooltip = document.getElementById('earthTooltip');
  let isJournalOpen = false;

  canvas.addEventListener('click', (e) => {
    if (isDragging && Math.abs(e.clientX - prevMX) > 5) return;
    mouse.x = (e.clientX/window.innerWidth)*2-1;
    mouse.y = -(e.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects([earthMesh, earthTexMesh], true);
    if (hits.length > 0) openJournal();
  });

  canvas.addEventListener('mousemove', (e) => {
    if (isDragging) return;
    mouse.x = (e.clientX/window.innerWidth)*2-1;
    mouse.y = -(e.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects([earthMesh, earthTexMesh], true);
    if (hits.length > 0) {
      canvas.style.cursor = 'pointer';
      tooltip.classList.add('visible');
      tooltip.style.left = (e.clientX+15)+'px';
      tooltip.style.top = (e.clientY-10)+'px';
    } else {
      canvas.style.cursor = 'grab';
      tooltip.classList.remove('visible');
    }
  });

  // ===== JOURNAL =====
  const journalPanel = document.getElementById('journalPanel');
  const journalTextarea = document.getElementById('journalDate');
  const journalYearBadge = document.getElementById('journalYearBadge');
  const journalEntriesDiv = document.getElementById('journalEntries');

  function openJournal() {
    isJournalOpen = true;
    journalPanel.classList.add('active');

    const diffMs = now.getTime() - dateOfBirth.getTime();
    const diffYears = diffMs / (1000*60*60*24*365.25);
    const yearsSince = Math.floor(diffYears);
    const targetDate = new Date(dateOfBirth);
    targetDate.setDate(targetDate.getDate() + Math.floor(diffYears * 365.25));

    document.getElementById('journalDate').textContent = targetDate.toLocaleDateString('en-US', {
      weekday:'long', year:'numeric', month:'long', day:'numeric'
    });
    journalYearBadge.textContent = `Year ${yearsSince} of ${AGE_LIMIT}`;

    const key = targetDate.toISOString().split('T')[0];
    journalTextarea.value = journalEntries[key] || '';

    // Show other entries
    renderOtherEntries(key);
  }

  function renderOtherEntries(excludeKey) {
    journalEntriesDiv.innerHTML = '';
    const sortedKeys = Object.keys(journalEntries).sort();
    sortedKeys.forEach(key => {
      if (key === excludeKey) return;
      const d = new Date(key);
      const item = document.createElement('div');
      item.className = 'entry-item';
      item.innerHTML = `<span class="e-date">${d.toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'})}</span><span class="e-text">${journalEntries[key].substring(0,120)}${journalEntries[key].length>120?'...':''}</span>`;
      item.style.cursor = 'pointer';
      item.addEventListener('click', () => {
        journalTextarea.value = journalEntries[key];
      });
      journalEntriesDiv.appendChild(item);
    });
  }

  function closeJournal() {
    isJournalOpen = false;
    journalPanel.classList.remove('active');
  }

  document.getElementById('journalCancel').addEventListener('click', closeJournal);
  document.getElementById('journalOverlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('journalOverlay')) closeJournal();
  });

  document.getElementById('journalSave').addEventListener('click', () => {
    const diffMs = now.getTime() - dateOfBirth.getTime();
    const diffYears = diffMs / (1000*60*60*24*365.25);
    const targetDate = new Date(dateOfBirth);
    targetDate.setDate(targetDate.getDate() + Math.floor(diffYears * 365.25));
    const key = targetDate.toISOString().split('T')[0];
    journalEntries[key] = journalTextarea.value;
    saveEntries();
    updateGhostEarths();
    closeJournal();
  });

  function saveEntries() {
    try { localStorage.setItem('cosmicJournal', JSON.stringify(journalEntries)); } catch(e) {}
  }
  function loadEntries() {
    try { const s = localStorage.getItem('cosmicJournal'); if(s) journalEntries = JSON.parse(s); } catch(e) {}
  }
  loadEntries();

  // ===== SETTINGS =====
  document.getElementById('settingsBtn').addEventListener('click', () => {
    document.getElementById('settingsPanel').classList.toggle('active');
    document.getElementById('settingsOverlay').classList.toggle('active');
  });
  document.getElementById('settingsOverlay').addEventListener('click', () => {
    document.getElementById('settingsPanel').classList.remove('active');
    document.getElementById('settingsOverlay').classList.remove('active');
  });

  const dobInput = document.getElementById('dobInput');
  dobInput.value = '1990-06-15';
  dateOfBirth = new Date(1990, 5, 15);

  dobInput.addEventListener('change', (e) => {
    dateOfBirth = new Date(e.target.value);
    updateEarthPosition(now);
    updateGhostEarths();
  });

  document.getElementById('sunSize').addEventListener('input', (e) => {
    sunScale = parseFloat(e.target.value);
    document.getElementById('sunSizeVal').textContent = sunScale.toFixed(1);
    sunMesh.scale.setScalar(sunScale);
    glowMesh.scale.setScalar(sunScale*1.8/2.5);
    glow2Mesh.scale.setScalar(sunScale*3/2.5);
    sunLight.intensity = 1.5+sunScale*0.5;
  });

  document.getElementById('earthSize').addEventListener('input', (e) => {
    earthScale = parseFloat(e.target.value);
    document.getElementById('earthSizeVal').textContent = earthScale.toFixed(1);
    earthMesh.scale.setScalar(earthScale);
    earthTexMesh.scale.setScalar(earthScale);
  });

  document.getElementById('moonSize').addEventListener('input', (e) => {
    moonScale = parseFloat(e.target.value);
    document.getElementById('moonSizeVal').textContent = moonScale.toFixed(1);
    moonMesh.scale.setScalar(moonScale);
  });

  function setupToggle(id, ref, cb) {
    const btn = document.getElementById(id);
    btn.addEventListener('click', () => {
      ref.value = !ref.value;
      btn.classList.toggle('active', ref.value);
      cb(ref.value);
    });
  }

  setupToggle('toggleStars', {value:true}, v => { showStars=v; if(starField) starField.visible=v; if(milkyWay) milkyWay.visible=v; });
  setupToggle('toggleOrbit', {value:true}, v => { showOrbit=v; orbitLine.visible=v; });
  setupToggle('toggleGlow', {value:true}, v => { showGlow=v; glowMesh.visible=v; glow2Mesh.visible=v; });
  setupToggle('toggleAutoRotate', {value:false}, v => { autoRotate=v; });

  // ===== ANIMATE =====
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    const time = clock.getElapsedTime();

    // Auto-rotate camera
    if (autoRotate) targetRotY += delta * 0.03;

    currentRotY += (targetRotY - currentRotY) * 0.05;
    currentRotX += (targetRotX - currentRotX) * 0.05;
    camDist += (targetCamDist - camDist) * 0.05;

    camera.position.x = Math.sin(currentRotY) * Math.cos(currentRotX) * camDist;
    camera.position.y = Math.sin(currentRotX) * camDist * 0.5 + 10;
    camera.position.z = Math.cos(currentRotY) * Math.cos(currentRotX) * camDist;
    camera.lookAt(0, 0, 0);

    // Earth rotation
    earthMesh.rotation.y += delta * 0.3;
    earthTexMesh.rotation.y += delta * 0.3;

    // Moon orbit
    const mAngle = time * 0.8;
    const mR = 1.2 * earthScale;
    moonMesh.position.x = Math.cos(mAngle) * mR;
    moonMesh.position.z = Math.sin(mAngle) * mR;
    moonMesh.position.y = Math.sin(mAngle*0.5) * 0.3 * earthScale;
    moonOrbitMesh.rotation.x = Math.PI/2 + Math.sin(time*0.3)*0.1;

    // Sun pulse
    sunMesh.scale.setScalar(sunScale * (1 + Math.sin(time*2)*0.02));

    // Stars slow rotation
    if (starField) starField.rotation.y += delta * 0.001;

    // Update date
    document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', {month:'short', day:'numeric'});
    document.getElementById('currentYear').textContent = now.getFullYear();

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Loading screen timeout: 2 seconds
  setTimeout(() => {
    document.getElementById('loadingScreen').classList.add('hidden');
  }, 2000);

  animate();
})();
</script>
</body>
</html>
